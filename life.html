<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eeeaf5"><title>搞钱天赋｜人生模拟器试玩章</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#292439;background:#eeeaf5}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #7355a6;outline-offset:3px}::selection{background:#d7c8f4}.app{width:min(100% - 24px,740px);margin:16px auto 64px}.card{background:#fff;border-radius:18px;box-shadow:0 12px 40px #4b397016;padding:26px;margin-bottom:14px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:850;color:#523c83;font-size:17px}.chapter-label{font-size:12px;color:#5d4c79;background:#f1ecfa;border-radius:50px;padding:7px 11px}.intro{text-align:center;padding:40px 25px}.avatar{width:min(52%,210px);height:225px;object-fit:contain;display:block;margin:0 auto 16px}.intro h1,.final h1{font-size:clamp(30px,7vw,46px);line-height:1.25;color:#483174;margin:7px 0 13px}.intro p,.final p{line-height:1.75;color:#575061}.small{font-size:13px!important;color:#6b617b!important}.rule{background:#f8f5fc;border-radius:12px;padding:17px 20px;text-align:left;margin:24px 0}.rule p{margin:4px 0;font-size:14px}.primary,.secondary{border-radius:10px;min-height:46px;padding:12px 20px;font-weight:700}.primary{border:0;background:#6850a1;color:#fff;box-shadow:0 7px 18px #6951a52c}.primary:hover{background:#513987}.secondary{background:#fff;border:1px solid #d4cbe6;color:#563d83}.secondary:hover{background:#f7f3fc}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.status-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.age{font-size:38px;font-weight:850;color:#49347c;line-height:1}.age span{font-size:15px;font-weight:600}.trail{font-size:12px;color:#746887}.progress{height:6px;background:#ebe7f2;border-radius:10px;overflow:hidden;margin-top:17px}.progress i{display:block;height:100%;background:#765aaf}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:17px}.stat{background:#f7f4fb;border-radius:10px;padding:10px 8px;text-align:center}.stat b{display:block;color:#4b367d;font-size:15px;white-space:nowrap}.stat span{font-size:11px;color:#756b84}.route-bar{display:flex;align-items:center;gap:15px}.route-bar img{width:76px;height:86px;object-fit:contain}.route-bar strong{display:block;font-size:17px;color:#4d387d}.route-bar p{font-size:12px;line-height:1.5;color:#746b80;margin:5px 0}.event-kind{font-size:12px;color:#7358a6;font-weight:800;margin:0 0 8px}.event h2{font-size:clamp(22px,5vw,29px);line-height:1.35;margin:0 0 13px}.event>p{line-height:1.75;color:#51495e;margin:0 0 22px}.options{display:grid;gap:10px}.choice{width:100%;border:1px solid #ded7ea;border-radius:12px;background:#faf9fd;text-align:left;padding:16px 18px;line-height:1.5;color:#322942;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.choice:hover{transform:translateY(-2px);border-color:#7455ac;box-shadow:0 8px 18px #60458d1f}.choice:active{transform:scale(.99)}.choice span{color:#7d61b0;font-weight:800;margin-right:10px}.outcome{background:#f5f1fb;border-radius:12px;padding:19px;margin:22px 0}.outcome p{line-height:1.75;margin:0}.changes{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.changes span{font-size:12px;background:#fff;border-radius:50px;padding:7px 10px;color:#513d76}.changes .negative{color:#a94b45}.settle{font-size:12px;color:#696078;line-height:1.6;margin-top:14px}.play-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.final{text-align:center;padding:35px 27px}.final ul{text-align:left;line-height:1.8;color:#51495e;padding-left:20px}.final .avatar{height:175px}.hidden{display:none!important}@media(max-width:560px){.app{width:min(100% - 16px,740px);margin:8px auto 36px}.card{padding:20px;border-radius:15px}.intro{padding:31px 18px}.stats{gap:5px}.stat{padding:9px 4px}.stat b{font-size:13px}.stat span{font-size:11px}.route-bar img{width:62px;height:76px}.age{font-size:32px}}@media(prefers-reduced-motion:reduce){.choice{transition:none}}
</style>
</head>
<body><main class="app">
<header class="card head"><div class="brand">搞钱天赋 · 人生模拟器</div><span class="chapter-label">18–24 岁试玩章</span></header><p id="saveStatus" class="small hidden"></p>
<section id="intro" class="card intro hidden"><img id="introAvatar" class="avatar" src="opportunity-scout.png" alt=""><h1 id="introTitle"></h1><p id="introCopy"></p><div class="rule"><p>每年做一个重大决定；你的天赋会被动改变部分结果。</p><p>财富、健康、关系与幸福感都会留下痕迹。挫折有代价，也有恢复机会。</p></div><div class="actions"><button id="begin" class="primary">从 18 岁开始</button><a class="secondary" href="index.html">重新测试天赋</a></div><p class="small">本章玩到 24 岁，结束后显示阶段报告；完整人生仍在制作中。</p></section>
<section id="game" class="hidden"><div class="card"><div class="status-top"><div class="age" id="age"></div><div class="trail" id="yearLabel"></div></div><div class="progress"><i id="progressBar"></i></div><div class="stats"><div class="stat"><b id="cash"></b><span>可用资金</span></div><div class="stat"><b id="health"></b><span>健康</span></div><div class="stat"><b id="relation"></b><span>关系</span></div><div class="stat"><b id="happy"></b><span>幸福感</span></div></div></div><div class="card route-bar"><img id="routeAvatar" src="opportunity-scout.png" alt=""><div><strong id="routeName"></strong><p id="routeAbility"></p></div></div><div class="card event"><p id="eventKind" class="event-kind"></p><h2 id="eventTitle"></h2><p id="eventStory"></p><div id="options" class="options"></div><div id="outcome" class="outcome hidden"><p id="outcomeText"></p><div id="changes" class="changes"></div><p id="settle" class="settle"></p></div><div class="play-actions"><button id="exit" class="secondary">保存并离开</button><button id="next" class="primary hidden">进入下一年</button></div></div></section>
<section id="final" class="card final hidden"><img id="finalAvatar" class="avatar" src="opportunity-scout.png" alt=""><span class="chapter-label">18–24 岁阶段报告</span><h1 id="finalTitle"></h1><p id="finalCopy"></p><div class="stats"><div class="stat"><b id="finalCash"></b><span>可用资金</span></div><div class="stat"><b id="finalHealth"></b><span>健康</span></div><div class="stat"><b id="finalRelation"></b><span>关系</span></div><div class="stat"><b id="finalHappy"></b><span>幸福感</span></div></div><ul id="highlights"></ul><p class="small">这是早期人生的阶段结算，不是完整人生结局。</p><div class="actions"><button id="restart" class="primary">用原天赋重开</button><a href="index.html" class="secondary">重新测试天赋</a></div></section>
</main><script src="life.js"></script></body></html>
